name: Pages

# The public engineering portal is authored in the project Wiki under site/.
# Wiki pushes cannot directly trigger a workflow in this repository, so manual
# dispatch and a daily sync keep GitHub Pages aligned with the Wiki. Every main
# push also republishes machine-generated engineering status.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch project Wiki
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Validate Wiki site contract
        run: make site-check WIKI_PATH=wiki

      - name: Generate engineering status
        run: make site-status WIKI_PATH=wiki SITE_STATUS_OUTPUT=wiki/site/project-status.json

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -R wiki/site/. _site/
          cat > _site/404.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/${GITHUB_REPOSITORY#*/}/">
          <title>SecFusionAgent</title>
          <p><a href="/${GITHUB_REPOSITORY#*/}/">Open SecFusionAgent engineering portal</a></p>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
