name: Pages

# Publishes the interactive requirements-flow diagram as the site root.
# The diagram is a single self-contained HTML file kept in the project wiki, and
# wiki commits do not trigger runs here, so a daily schedule keeps the site in
# sync; run the workflow manually when the diagram changes.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the diagram from the project wiki
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          mkdir -p _site
          cp wiki/prd-flow/prd-requirements-flow.html _site/index.html
          cat > _site/404.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=/${GITHUB_REPOSITORY#*/}/">
          <title>需求主链路图</title>
          <p><a href="/${GITHUB_REPOSITORY#*/}/">前往需求主链路图</a></p>
          HTML
          ls -l _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
