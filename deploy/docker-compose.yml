services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: secfusion
      POSTGRES_USER: secfusion
      POSTGRES_PASSWORD: secfusion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secfusion -d secfusion"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - secfusion-postgres:/var/lib/postgresql/data

  redis-broker:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - secfusion-redis-broker:/data

  redis-cache:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lfu",
      ]
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: secfusion
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - secfusion-minio:/data

volumes:
  secfusion-postgres:
  secfusion-redis-broker:
  secfusion-minio:
