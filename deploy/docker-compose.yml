services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    image: secfusion-postgres:pg16-pgvector
    environment:
      POSTGRES_DB: secfusion
      POSTGRES_USER: secfusion
      POSTGRES_PASSWORD: secfusion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secfusion -d secfusion"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - secfusion-postgres:/var/lib/postgresql/data

  redis-broker:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - secfusion-redis-broker:/data

  redis-cache:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lfu",
      ]
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: secfusion
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - secfusion-minio:/data

  localstack-s3:
    image: public.ecr.aws/localstack/localstack:4.14.0
    profiles: ["integration"]
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:4566/_localstack/health | grep -Eq '"s3": "(running|available)"'
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  localstack-data:
  secfusion-postgres:
  secfusion-redis-broker:
  secfusion-minio:
