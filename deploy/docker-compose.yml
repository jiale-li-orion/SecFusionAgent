x-app-runtime: &app-runtime
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: secfusion-app:dev
  profiles: ["runtime"]
  restart: unless-stopped
  environment: &app-runtime-environment
    SECFUSION_ENVIRONMENT: dev
    SECFUSION_DATABASE_URL: postgresql+asyncpg://secfusion:secfusion@postgres:5432/secfusion
    SECFUSION_REDIS_BROKER_URL: redis://redis-broker:6379/0
    SECFUSION_REDIS_HOT_CACHE_URL: redis://redis-cache:6379/0
    SECFUSION_REDIS_TASK_BUS_URL: redis://redis-task-bus:6379/0
    SECFUSION_S3_ENDPOINT_URL: http://localstack-s3:4566
    SECFUSION_S3_ACCESS_KEY: secfusion
    SECFUSION_S3_SECRET_KEY: change-me
    SECFUSION_S3_BUCKET: secfusion-evidence
    SECFUSION_RUNTIME_ARTIFACT_BUCKET: secfusion-runtime-artifacts
    SECFUSION_S3_REGION: us-east-1
    SECFUSION_NVD_API_KEY: ${SECFUSION_NVD_API_KEY:-}
    SECFUSION_GITHUB_TOKEN: ${SECFUSION_GITHUB_TOKEN:-}
    SECFUSION_MODEL_BASE_URL: ${SECFUSION_MODEL_BASE_URL:-}
    SECFUSION_MODEL_API_KEY: ${SECFUSION_MODEL_API_KEY:-}
    SECFUSION_MODEL_NAME: ${SECFUSION_MODEL_NAME:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis-broker:
      condition: service_started
    redis-cache:
      condition: service_started
    redis-task-bus:
      condition: service_started
    localstack-s3:
      condition: service_healthy

services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    image: secfusion-postgres:pg16-pgvector
    environment:
      POSTGRES_DB: secfusion
      POSTGRES_USER: secfusion
      POSTGRES_PASSWORD: secfusion
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secfusion -d secfusion"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - secfusion-postgres:/var/lib/postgresql/data

  redis-broker:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - secfusion-redis-broker:/data

  redis-cache:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lfu",
      ]
    ports:
      - "6380:6379"

  redis-task-bus:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6381:6379"
    volumes:
      - secfusion-redis-task-bus:/data

  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: secfusion
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - secfusion-minio:/data

  localstack-s3:
    image: public.ecr.aws/localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:4566/_localstack/health | grep -Eq '"s3": "(running|available)"'
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - localstack-data:/var/lib/localstack

  scheduler:
    <<: *app-runtime
    command: ["python", "-m", "apps.worker.scheduler"]

  worker-collection:
    <<: *app-runtime
    command:
      [
        "celery",
        "-A",
        "apps.worker.celery_app:celery_app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "collection",
        "--concurrency=4",
      ]

  worker:
    <<: *app-runtime
    command:
      [
        "celery",
        "-A",
        "apps.worker.celery_app:celery_app",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "enrichment,investigation,indexing",
      ]

volumes:
  localstack-data:
  secfusion-postgres:
  secfusion-redis-broker:
  secfusion-redis-task-bus:
  secfusion-minio:
